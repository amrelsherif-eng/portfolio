<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amr Elsherif | Portfolio</title>
<meta name="description" content="Amr Elsherif — Electronics & Communications Engineer | Cloud, DevOps & Systems. Portfolio launching soon.">
<style>
  :root {
    --bg: #0b0d12;
    --text: #e8eaf0;
    --muted: #8b92a5;
    --accent: #7c9cff;
    --accent-2: #5eead4;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(600px circle at 15% 20%, rgba(124, 156, 255, 0.18), transparent 60%),
      radial-gradient(500px circle at 85% 80%, rgba(94, 234, 212, 0.14), transparent 60%),
      var(--bg);
  }
  .card {
    width: 100%;
    max-width: 560px;
    padding: 48px 40px;
    text-align: center;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  h1 {
    font-size: clamp(2rem, 6vw, 2.75rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .title {
    margin-top: 12px;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding: 8px 16px;
    font-size: 0.9rem;
    color: var(--accent-2);
    background: rgba(94, 234, 212, 0.08);
    border: 1px solid rgba(94, 234, 212, 0.25);
    border-radius: 999px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .links {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 32px;
  }
  .links a {
    padding: 12px 22px;
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .links a:hover, .links a:focus-visible {
    border-color: var(--accent);
    transform: translateY(-2px);
    outline: none;
  }
  @media (max-width: 480px) { .card { padding: 36px 24px; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .links a { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <h1>Amr Elsherif</h1>
    <p class="title">Electronics &amp; Communications Engineer | Cloud, DevOps &amp; Systems</p>
    <div class="status"><span class="dot"></span>Portfolio Under Construction · Launching Soon</div>
    <nav class="links" aria-label="Profiles">
      <a href="https://github.com/amrelsherif-eng" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/amrelsherif-eng" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
